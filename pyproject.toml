[project]
name = "shuku"
version = "0.0.8"  # Managed by 'release' script.
description = "A command-line tool for condensing video and audio files based on subtitle timestamps, optimizing media content for language learning and study."
authors = [{ name = "Óscar Fernández", email = "osc@osc.garden" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["media-condensation", "video", "audio", "subtitle", "subtitles", "condenser", "language learning", "immersion learning", "summarization"]
classifiers = [
    "Environment :: Console",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Operating System :: OS Independent",
]
dependencies = [
    "pysubs2>=1.7.3,<2",
    "python-ffmpeg>=2.0.12,<3",
]

[project.urls]
Homepage = "https://github.com/welpo/shuku"
Repository = "https://github.com/welpo/shuku"
Documentation = "https://github.com/welpo/shuku"

[project.scripts]
shuku = "shuku.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.16.0,<0.17",
    "ty>=0.0.65,<0.1",
]
build = [
    "pyinstaller>=6.11.0,<7 ; python_full_version < '3.14'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shuku"]

[tool.hatch.build.targets.sdist]
include = ["shuku", "CHANGELOG.md"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
logger-objects = ["logging_setup.logger"]
select = ["I"]

[tool.coverage.run]
omit = [
    "*/shuku/demo_utils.py",
]
